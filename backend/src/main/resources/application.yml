server:
  port: 8080

spring:
  application:
    name: alice-learn
  datasource:
    url: jdbc:mysql://localhost:3306/alice_learn?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  override-with-generic-response: false
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.alice.learn.controller

alice:
  jwt:
    secret: alice-learn-dev-jwt-secret-key-please-change-32b
    expire-hours: 72
  cors:
    allowed-origins: http://localhost:5173
